[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civiccharge"
version = "0.1.0"
description = "Assured multimodal intelligence for public planning records"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Oluwagbade Odimayo" }
]
keywords = [
    "document-ai",
    "ocr",
    "machine-learning",
    "planning-data",
    "multimodal-ai",
    "public-sector"
]

dependencies = [
    "httpx>=0.28,<1.0",
    "pydantic>=2.13,<3.0",
    "pypdf>=6.14,<7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.4,<10.0",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["civiccharge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
